/* Minecraft configuration */

minecraft {
    version = "${mc_version}-${forge_version}"  // 這會根據 mc_version 和 forge_version 的設置自動拼接
    runDir = "run"
    mappings = "snapshot"  // 使用 snapshot 映射

    clientJvmArgs = ["-Xmx1G", "-Dfml.coreMods.load=" + coremodPath]
    serverJvmArgs = ["-Xmx1G"]

    replace "%VERSION%", project.version  // 替換版本號
}
